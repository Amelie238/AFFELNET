<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget AFFELNET – Accès aux contrôles</title>
<!-- Fichier à placer dans le dépôt GitHub, à côté de index.html -->
<script src="./grist-plugin-api.js"></script>
<style>
  :root {
    --bg: #fbf9ff; --card: #ffffff; --text: #3d3a4f; --muted: #8b88a0;
    --border: #e6e1f2; --accent: #b9a7f0; --accent-soft: #efeafd;
    --c1: #dff3ea; --c1b: #a9dcc3;
    --c2: #fde9d9; --c2b: #f5c6a0;
    --c3: #dfeefb; --c3b: #a8cdee;
    --c4: #fbe3ee; --c4b: #efb4cf;
    --c5: #ece6fb; --c5b: #c9bbf0;
    --c6: #fdf5cf; --c6b: #ecd98a;
    --ok: #dff3ea; --okt: #2f7a5a;
    --att: #fdf0d5; --attt: #9a6b12;
    --ko: #fbe0e4; --kot: #a23b52;
    --neutre: #eceaf3; --neutret: #6b6880;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  h1 { font-size: 1.05rem; margin: 0 0 12px; font-weight: 600; }
  .cache { display: none !important; }

  /* ---------- Accueil ---------- */
  #grille { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .carte { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(120,100,180,.06); }
  .carte { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--card) 60%); }
  .case { font-weight: 600; }
  .entrees { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .entree { display: block; width: 100%; text-align: left; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid; font-size: .85rem; line-height: 1.3; color: var(--text); cursor: pointer; transition: transform .08s ease, box-shadow .08s ease; }
  .entree:hover:not(.inactif) { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,.08); }
  .entree small { display: block; color: var(--muted); margin-top: 2px; font-size: .72rem; }
  .entree.e1 { background: var(--c1); border-color: var(--c1b); }
  .entree.e2 { background: var(--c2); border-color: var(--c2b); }
  .entree.e3 { background: var(--c3); border-color: var(--c3b); }
  .entree.e4 { background: var(--c4); border-color: var(--c4b); }
  .entree.e5 { background: var(--c5); border-color: var(--c5b); }
  .entree.e6 { background: var(--c6); border-color: var(--c6b); }
  .entree.inactif { opacity: .6; cursor: default; border-style: dashed; }
  .entree.nc { opacity: .65; }

  /* ---------- Barre commune des vues ---------- */
  .barre { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .barre h2 { font-size: .98rem; margin: 0; flex: 1 1 200px; font-weight: 600; }
  button.retour, #recherche, #rechercheAff, #rechercheCtrl { font: inherit; font-size: .85rem; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  button.retour { cursor: pointer; background: var(--accent-soft); }
  button.retour:hover { border-color: var(--accent); }
  #recherche, #rechercheAff, #rechercheCtrl { min-width: 220px; }
  #compteur { color: var(--muted); font-size: .8rem; }

  /* ---------- Vue tableau générique ---------- */
  .defil { overflow: auto; max-height: calc(100vh - 110px); border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
  table { border-collapse: collapse; width: 100%; font-size: .8rem; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--accent-soft); font-weight: 600; }
  tr:hover td { background: #faf8ff; }

  /* ---------- Vue Affectation ---------- */
  .puces { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .puce { font-size: .78rem; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--border); }
  .puce b { font-weight: 700; }
  #listeAff { display: flex; flex-direction: column; gap: 12px; }
  details.ville { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 2px 8px rgba(120,100,180,.05); }
  details.ville > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; background: var(--c3); border-radius: 14px; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
  details.ville[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  details.ville > summary::-webkit-details-marker { display: none; }
  .nbville { font-weight: 400; font-size: .8rem; color: var(--muted); }
  .etab { padding: 10px 14px 4px; }
  .etabtete { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
  .etabnom { font-weight: 600; font-size: .9rem; }
  .uai { font-family: Consolas, monospace; font-size: .72rem; padding: 2px 8px; border-radius: 8px; background: var(--c4); border: 1px solid var(--c4b); }
  .cand { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(200px, 2fr) auto; gap: 8px 14px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--border); font-size: .82rem; }
  .cand:first-of-type { border-top: none; }
  .candnom { font-weight: 600; }
  .formations { color: var(--muted); font-size: .78rem; line-height: 1.35; }
  .formations .fl { color: var(--text); }
  .badge { font-size: .74rem; padding: 3px 10px; border-radius: 999px; white-space: nowrap; font-weight: 600; }
  .badge.ok { background: var(--ok); color: var(--okt); }
  .badge.att { background: var(--att); color: var(--attt); }
  .badge.ko { background: var(--ko); color: var(--kot); }
  .badge.neutre { background: var(--neutre); color: var(--neutret); }
  .vide { color: var(--muted); padding: 18px; text-align: center; font-size: .9rem; }
  .alerte { background: var(--att); color: var(--attt); border-radius: 10px; padding: 10px 12px; font-size: .82rem; margin-bottom: 12px; }
  details.diag { margin-top: 14px; font-size: .75rem; color: var(--muted); }
  details.diag summary { cursor: pointer; }
  details.diag ul { margin: 6px 0 0; padding-left: 18px; }
  @media (max-width: 640px) { .cand { grid-template-columns: 1fr; } }

  /* ---------- Sous-menu ---------- */
  #choixSous { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  #choixSous .entree { padding: 14px 16px; font-size: .92rem; }
  .sg { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 14px; background: var(--c3); border-top: 1px solid var(--c3b); border-bottom: 1px solid var(--c3b); font-size: .82rem; font-weight: 600; }
  .sg .eonb { margin-left: auto; font-weight: 400; }
  .bonus { display: inline-block; min-width: 28px; text-align: center; padding: 2px 8px; border-radius: 8px; background: var(--c5); border: 1px solid var(--c5b); font-weight: 600; }
  .nbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .nbs span { font-size: .76rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.75); border: 1px solid var(--border); color: var(--text); }
  .nbs .att { font-weight: 400; color: var(--muted); }

  /* ---------- Onglets et compteurs des vues ---------- */
  .onglets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .onglet { font: inherit; font-size: .82rem; padding: 7px 14px; border-radius: 999px; border: 1px solid; cursor: pointer; color: var(--text); transition: transform .08s ease, box-shadow .08s ease; }
  .onglet:hover:not(.inactif) { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,.08); }
  .onglet.on { font-weight: 700; box-shadow: 0 0 0 2px var(--accent); }
  .onglet.inactif { opacity: .5; cursor: not-allowed; }

  /* ---------- Vue Contrôle de la saisie des candidatures ---------- */
  .filtreChg { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .filtreLib { font-size: .8rem; color: var(--muted); font-weight: 600; margin-right: 2px; }
  #chipsChg { display: contents; }
  .chip { font: inherit; font-size: .78rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; transition: transform .08s ease, box-shadow .08s ease; }
  .chip:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,.08); }
  .chip.on { box-shadow: 0 0 0 2px var(--accent); font-weight: 700; }
  .chip b { font-weight: 700; margin-left: 4px; opacity: .7; }
  .t0 { background: var(--c1); border-color: var(--c1b); }
  .t1 { background: var(--c2); border-color: var(--c2b); }
  .t2 { background: var(--c3); border-color: var(--c3b); }
  .t3 { background: var(--c4); border-color: var(--c4b); }
  .t4 { background: var(--c5); border-color: var(--c5b); }
  .t5 { background: var(--c6); border-color: var(--c6b); }
  .t-tous { background: var(--accent-soft); border-color: var(--accent); }
  #listeCtrl { display: flex; flex-direction: column; gap: 14px; }
  details.etabo { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 2px 8px rgba(120,100,180,.05); overflow: hidden; }
  details.etabo > summary { cursor: pointer; list-style: none; padding: 11px 14px; background: linear-gradient(90deg, var(--c5), var(--c3)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  details.etabo > summary::-webkit-details-marker { display: none; }
  .eonom { font-weight: 600; font-size: .92rem; flex: 1 1 240px; }
  .eocontact { display: flex; flex-wrap: wrap; gap: 8px; }
  .eocontact a, .eocontact span { font-size: .75rem; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.75); border: 1px solid var(--border); color: var(--text); text-decoration: none; }
  .eocontact a:hover { border-color: var(--accent); }
  .eocontact .absent { color: var(--muted); font-style: italic; }
  .eonb { font-size: .78rem; color: var(--muted); }
  .ctab-defil { overflow-x: auto; }
  table.ctab { font-size: .8rem; }
  table.ctab th { background: var(--c6); border-bottom: 1px solid var(--c6b); position: static; }
  table.ctab td { white-space: normal; vertical-align: top; }
  table.ctab tr:hover td { background: #faf8ff; }
  table.ctab tr.debut td { border-top: 2px solid var(--border); }
  table.ctab td.eleve { font-weight: 600; background: #fcfbff; }
  .rang { display: inline-block; min-width: 24px; text-align: center; font-weight: 700; padding: 2px 6px; border-radius: 8px; background: var(--c1); border: 1px solid var(--c1b); }
  .code { font-family: Consolas, monospace; font-size: .72rem; padding: 2px 8px; border-radius: 8px; background: var(--c4); border: 1px solid var(--c4b); white-space: nowrap; }
  .chg { font-size: .74rem; padding: 3px 10px; border-radius: 999px; border: 1px solid; font-weight: 600; display: inline-block; }
</style>
</head>
<body>

<!-- Accueil : une carte par structure, avec les 4 entrées -->
<div id="accueil">
  <h1>Accès aux contrôles par structure</h1>
  <div id="grille"></div>
</div>

<!-- Vue tableau générique -->
<div id="vueTable" class="cache">
  <div class="barre">
    <button class="retour" id="retour">← Retour</button>
    <h2 id="titreTable"></h2>
    <input id="recherche" type="search" placeholder="Rechercher…">
    <span id="compteur"></span>
  </div>
  <div class="defil"><table id="tableau"></table></div>
</div>

<!-- Vue Affectation -->
<div id="vueAff" class="cache">
  <div class="barre">
    <button class="retour" id="retourAff">← Retour</button>
    <h2 id="titreAff"></h2>
    <input id="rechercheAff" type="search" placeholder="Rechercher un candidat, une ville…">
    <span id="compteurAff"></span>
  </div>
  <div id="alerteAff"></div>
  <div class="puces" id="puces"></div>
  <div id="listeAff"></div>
  <details class="diag"><summary>Colonnes utilisées</summary><ul id="diag"></ul></details>
</div>

<!-- Sous-menu de « Contrôle de la saisie des candidatures » -->
<div id="vueSous" class="cache">
  <div class="barre">
    <button class="retour" id="retourSous">← Retour</button>
    <h2 id="titreSous"></h2>
  </div>
  <div id="choixSous"></div>
</div>

<!-- Vues groupées par établissement d'origine -->
<div id="vueCtrl" class="cache">
  <div class="barre">
    <button class="retour" id="retourCtrl">← Retour</button>
    <h2 id="titreCtrl"></h2>
    <input id="rechercheCtrl" type="search" placeholder="Rechercher un élève, un établissement…">
    <span id="compteurCtrl"></span>
  </div>
  <div class="onglets" id="ongletsCtrl"></div>
  <div id="alerteCtrl"></div>
  <div class="filtreChg" id="filtreBloc"><span class="filtreLib" id="filtreLib">Changement :</span><span id="chipsChg"></span></div>
  <div id="listeCtrl"></div>
  <details class="diag"><summary>Colonnes utilisées</summary><ul id="diagCtrl"></ul></details>
</div>

<script>
/* ================== CONFIGURATION ================== */

// Structures affichées sur l'accueil (plus aucun lien avec la table « Utilisateurs »).
// "valeurs" : valeurs de la colonne « Service en charge du traitement » qui rattachent un candidat à cette case.
const CASES = [
  { label: "SRAIOLDS", valeurs: ["SAIO", "SRAIOLDS"] },
  { label: "DRAAF",    valeurs: ["DRAAF"] },
  { label: "DSDEN 24", valeurs: ["DSDEN 24"] },
  { label: "DSDEN 33", valeurs: ["DSDEN 33"] },
  { label: "DSDEN 40", valeurs: ["DSDEN 40"] },
  { label: "DSDEN 47", valeurs: ["DSDEN 47"] },
  { label: "DSDEN 64", valeurs: ["DSDEN 64"] }
];

// Entrées affichées dans chaque carte.
// rendu : "affectation" = vue mise en forme (filtrée selon le service en charge) ; "sousmenu" = page de choix (voir SOUS_CHOIX) ; "tableau" = tableau simple.
// tableId : identifiant Grist de la table (sans tiret). null = table pas encore précisée.
// Choix proposés quand on clique sur « Contrôle de la saisie des candidatures (avril - juin) ».
// vue : clé de VUES_CTRL (mise en forme). tableId null = table pas encore précisée.
const SOUS_CHOIX = [
  { classe: "e1", label: "2nde pro sans saisie",          tableId: "CONTROLES_2PRO_SANS_SAISIE", vue: "2pro" },
  { classe: "e2", label: "2nde pro sans avis CE",         tableId: "CONTROLES_2PRO_SANS_AVIS",   vue: "2pro_sans_avis" },
  { classe: "e3", label: "Erreurs saisies 1ère",          tableId: "CONTROLES_1ERE",             vue: "1ere" },
  { classe: "e4", label: "Motifs de dérog saisis à tort", tableId: null,                         vue: null }
];

// Choix proposés quand on clique sur « Contrôle de l'admission (juin) ».
// tableId null = table pas encore précisée : à renseigner (tableId + vue) au fur et à mesure.
const SOUS_CHOIX_ADMISSION = [
  { classe: "e1", label: "Montants non affectés en 1ère Pro",         tableId: "AFFECTATION_1ERE_PRO",     vue: "aff_pro" },
  { classe: "e2", label: "Montants non affectés en 1ère Techno",      tableId: "AFFECTATION_1ERE_TECHNO",  vue: "aff_techno" },
  { classe: "e3", label: "Élèves du secteur non affectés en 2nde GT", tableId: null, vue: null },
  { classe: "e4", label: "Redoublants non affectés",                  tableId: null, vue: null },
  { classe: "e5", label: "2nde pro refusés sur tous leurs vœux",      tableId: null, vue: null },
  { classe: "e6", label: "Avis DSDEN Emménagement",                   tableId: null, vue: null }
];

const ENTREES = [
  { classe: "e1", label: "Contrôle de la saisie des nomenclatures (février - avril)",         tableId: null,               rendu: "tableau" },
  { classe: "e2", label: "Contrôle de la saisie des candidatures (avril - juin)",             tableId: null,               rendu: "sousmenu", sousmenu: SOUS_CHOIX },
  { classe: "e3", label: "Contrôle de l'admission (juin)",                                    tableId: null,               rendu: "sousmenu", sousmenu: SOUS_CHOIX_ADMISSION },
  { classe: "e4", label: "Saisie des places vacantes - Tours suivants (juillet - septembre)", tableId: null,               rendu: "tableau" }
];

// Colonnes de la table AFFECTATION_1ERE.
// Le widget cherche chaque colonne par son libellé (motifs listés par ordre de préférence).
// Si une colonne est mal détectée, renseignez "col" avec son libellé ou son identifiant exact.
const CHAMPS_AFF = [
  { cle: "ville",   nom: "Ville",               col: null, motifs: ["ville accueil", "ville etablissement", "ville"], exclure: ["origine"] },
  { cle: "etab",    nom: "Établissement",       col: null, motifs: ["etablissement accueil", "etablissement d accueil", "etablissement", "lycee"], exclure: ["origine", "ville", "code", "uai"] },
  { cle: "uai",     nom: "Code UAI",            col: null, motifs: ["code uai accueil", "uai accueil", "code uai", "uai"], exclure: ["origine"] },
  { cle: "formAcc", nom: "Formation d'accueil", col: null, motifs: ["formation accueil", "formation d accueil", "formation"], exclure: ["origine"] },
  { cle: "formOri", nom: "Formation d'origine", col: null, motifs: ["formation origine", "formation d origine"], exclure: [] },
  { cle: "nom",     nom: "Nom",                 col: null, motifs: ["nom candidat", "nom eleve", "nom"], exclure: ["etablissement", "formation", "service", "prenom"] },
  { cle: "prenom",  nom: "Prénom",              col: null, motifs: ["prenom candidat", "prenom eleve", "prenom"], exclure: ["etablissement", "formation"] },
  { cle: "result",  nom: "Résultat",            col: null, motifs: ["resultat affectation", "resultat", "decision affectation", "decision", "affectation"], exclure: ["formation", "service"] },
  { cle: "service", nom: "Service en charge du traitement", col: null, motifs: ["service en charge du traitement", "service en charge", "service"], exclure: [] }
];

// Colonnes de la table CONTROLES_1ERE (même principe de détection par libellé que ci-dessus).
const CHAMPS_CTRL = [
  { cle: "etabOri",   nom: "Établissement d'origine",   col: null, motifs: ["etab origine", "etablissement origine", "etablissement d origine"], exclure: ["telephone", "mel", "numero", "code", "uai"] },
  { cle: "tel",       nom: "Téléphone établissement",   col: null, motifs: ["numero telephone etab nat eleve", "telephone etab nat eleve", "telephone"], exclure: [] },
  { cle: "mel",       nom: "Mél établissement",         col: null, motifs: ["mel etab national eleve", "mel etab nat eleve", "mel"], exclure: [] },
  { cle: "eleve",     nom: "Élève",                     col: null, motifs: ["eleve"], exclure: ["formation", "libelle", "etab", "telephone", "mel", "numero", "nat"] },
  { cle: "formEleve", nom: "Libellé formation élève",   col: null, motifs: ["libelle formation eleve", "formation eleve"], exclure: [] },
  { cle: "rang",      nom: "Rang",                      col: null, motifs: ["rang"], exclure: [] },
  { cle: "formVoeu",  nom: "Libellé formation vœu",     col: null, motifs: ["libelle formation voeu", "formation voeu"], exclure: [] },
  { cle: "etabAcc",   nom: "Établissement d'accueil",   col: null, motifs: ["etablissement d accueil", "etablissement accueil", "etab accueil", "libelle etablissement voeu", "etablissement voeu", "etab voeu"], exclure: ["origine", "code", "uai", "telephone", "mel", "numero", "nat"] },
  { cle: "codeAvis",  nom: "Code avis chef étab. vœu",  col: null, motifs: ["code avis chef etab voeu", "code avis"], exclure: [] },
  { cle: "libAvis",   nom: "Lib Avis CE",               col: null, motifs: ["lib avis ce", "libelle avis ce", "libelle avis", "avis ce"], exclure: ["code"] },
  { cle: "chg",       nom: "Changement",                col: null, motifs: ["changement"], exclure: [] },
  { cle: "service",   nom: "Service en charge du traitement", col: null, motifs: ["service en charge du traitement", "service en charge", "service"], exclure: [] }
];

// Colonnes de la table CONTROLES_2PRO_SANS_SAISIE.
const CHAMPS_2PRO = [
  CHAMPS_CTRL[0], CHAMPS_CTRL[1], CHAMPS_CTRL[2],
  { cle: "eleve",      nom: "Élève",         col: null, motifs: ["eleve"], exclure: ["formation", "libelle", "etab", "telephone", "mel", "numero", "nat", "classe"] },
  { cle: "classe",     nom: "Classe",        col: null, motifs: ["classe"], exclure: [] },
  { cle: "mnemo",      nom: "Mnémonique",    col: null, motifs: ["mnemonique", "mnemo"], exclure: [] },
  { cle: "specialite", nom: "Spécialité",    col: null, motifs: ["specialite"], exclure: [] },
  { cle: "formation",  nom: "Libellé formation", col: null, motifs: ["libelle formation", "formation"], exclure: [] },
  CHAMPS_CTRL[11]
];

// Colonnes de la table CONTROLES_2PRO_SANS_AVIS.
const CHAMPS_2PRO_SANS_AVIS = [
  CHAMPS_CTRL[0], CHAMPS_CTRL[1], CHAMPS_CTRL[2],
  CHAMPS_2PRO[3], CHAMPS_2PRO[5], CHAMPS_2PRO[6],
  CHAMPS_CTRL[4], CHAMPS_CTRL[5], CHAMPS_CTRL[6],

const $ = function (id) { return document.getElementById(id); };
function norm(s) {
  return String(s === null || s === undefined ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/œ/g, "oe").replace(/[^a-z0-9]+/g, " ").trim();
}
function sansEspaces(s) { return norm(s).replace(/ /g, ""); }
function h(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}
function texte(v) {
  if (v === null || v === undefined) return "";
  if (v === true) return "✓";
  if (v === false) return "";
  if (Array.isArray(v)) return v.filter(function (x) { return x !== "L"; }).join(", ");
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

let candidats = [];   // lignes déjà filtrées sur le service en charge

// Métadonnées des colonnes (libellé, type, colonne affichée des références).
// Cache des lectures (tables, métadonnées) : une même table n'est lue qu'une fois pendant CACHE_DUREE.
const CACHE_DUREE = 5 * 60 * 1000;
const cacheLectures = {};
function memo(cle, fn) {
  const e = cacheLectures[cle];
  if (e && Date.now() - e.t < CACHE_DUREE) return e.p;
  const p = Promise.resolve().then(fn);
  cacheLectures[cle] = { t: Date.now(), p: p };
  p.catch(function () { if (cacheLectures[cle] && cacheLectures[cle].p === p) delete cacheLectures[cle]; });
  return p;
}
function lireTable(id) { return memo("t:" + id, function () { return grist.docApi.fetchTable(id); }); }

async function lireMeta(tableId) {
  const res = await Promise.all([lireTable("_grist_Tables"), lireTable("_grist_Tables_column")]);
  const T = res[0], C = res[1];
  const ti = T.tableId.indexOf(tableId);
  if (ti < 0) throw new Error("table introuvable");
  const tid = T.id[ti];
  const colIdParId = {};
  C.id.forEach(function (id, i) { colIdParId[id] = C.colId[i]; });
  const metas = [];
  C.id.forEach(function (id, i) {
    if (C.parentId[i] !== tid) return;
    const colId = C.colId[i];
    if (colId === "manualSort" || colId.indexOf("gristHelper_") === 0) return;
    metas.push({ colId: colId, label: C.label[i] || colId, type: C.type[i] || "",
                 visible: C.visibleCol && C.visibleCol[i] ? colIdParId[C.visibleCol[i]] : null });
  });
  return metas;
}

function trouverColonne(champ, metas) {
  if (champ.col) {
    const n = norm(champ.col);
    return metas.find(function (m) { return norm(m.label) === n || norm(m.colId) === n; }) || null;
  }
  const ok = function (m) {
    const n = norm(m.label), n2 = norm(m.colId);
    return !champ.exclure.some(function (x) { return n.indexOf(x) !== -1 || n2.indexOf(x) !== -1; });
  };
  for (const mo of champ.motifs) {                       // 1) correspondance exacte
    const m = metas.find(function (m) { return norm(m.label) === mo || norm(m.colId) === mo; });
    if (m) return m;
  }
  for (const mo of champ.motifs) {                       // 2) libellé contenant le motif
    const m = metas.find(function (m) { return ok(m) && (norm(m.label).indexOf(mo) !== -1 || norm(m.colId).indexOf(mo) !== -1); });
    if (m) return m;
  }
  return null;
}

async function ouvrirAffectation(entree, c) {
  vueOuverte = true;
  $("accueil").classList.add("cache");
  $("vueAff").classList.remove("cache");
  $("titreAff").textContent = entree.label + " — " + c.label;
  $("rechercheAff").value = "";
  $("compteurAff").textContent = "Chargement…";
  $("listeAff").innerHTML = "";
  $("puces").innerHTML = "";
  $("alerteAff").innerHTML = "";
  $("diag").innerHTML = "";

  try {
    const data = await grist.docApi.fetchTable(entree.tableId);
    let metas;
    try { metas = await lireMeta(entree.tableId); }
    catch (e) {
      metas = Object.keys(data).filter(function (k) { return k !== "id" && k !== "manualSort" && k.indexOf("gristHelper_") !== 0; })
        .map(function (k) { return { colId: k, label: k, type: "", visible: null }; });
    }

    // Détection des colonnes
    const cols = {};
    CHAMPS_AFF.forEach(function (ch) { cols[ch.cle] = trouverColonne(ch, metas); });
    CHAMPS_AFF.forEach(function (ch) {
      const li = h("li", null, ch.nom + " ← " + (cols[ch.cle] ? cols[ch.cle].label : "NON TROUVÉE"));
      $("diag").appendChild(li);
    });

    // Résolution des colonnes de type référence (valeur affichée au lieu du numéro de ligne)
    const resolu = {};
    for (const ch of CHAMPS_AFF) {
      const m = cols[ch.cle];
      if (m && m.type.indexOf("Ref:") === 0) {
        try {
          const ref = await grist.docApi.fetchTable(m.type.slice(4));
          const cible = m.visible && ref[m.visible] ? m.visible : null;
          const dict = {};
          ref.id.forEach(function (id, i) { dict[id] = cible ? ref[cible][i] : id; });
          resolu[ch.cle] = dict;
        } catch (e) { /* on garde la valeur brute */ }
      }
    }
    const valeur = function (cle, i) {
      const m = cols[cle];
      if (!m || !data[m.colId]) return "";
      const v = data[m.colId][i];
      return texte(resolu[cle] && resolu[cle][v] !== undefined ? resolu[cle][v] : v);
    };

    if (!cols.service) {
      $("alerteAff").appendChild(h("div", "alerte", "La colonne « Service en charge du traitement » est introuvable : aucun candidat n'est affiché afin de ne pas montrer des données d'une autre structure. Indiquez son libellé exact dans CHAMPS_AFF (champ « col »)."));
      candidats = [];
    } else {
      const attendues = c.valeurs.map(sansEspaces);
      candidats = [];
      (data.id || []).forEach(function (_, i) {
        if (attendues.indexOf(sansEspaces(valeur("service", i))) === -1) return;
        candidats.push({
          ville: valeur("ville", i), etab: valeur("etab", i), uai: valeur("uai", i),
          formAcc: valeur("formAcc", i), formOri: valeur("formOri", i),
          nom: valeur("nom", i), prenom: valeur("prenom", i), result: valeur("result", i)
        });
      });
    }
    dessinerAff();
  } catch (err) {
    console.error(err);
    $("compteurAff").textContent = "Impossible de lire la table « " + entree.tableId + " » (identifiant correct ? même document ?).";
  }
}

function classeResultat(r) {
  const n = norm(r);
  if (!n) return "neutre";
  if (/\b(non|refus|refuse|rejet|rejete|pas)\b/.test(n)) return "ko";
  if (/(attente|liste|en cours|provisoire)/.test(n)) return "att";
  if (/(affect|admis|accept|oui|valide)/.test(n)) return "ok";
  return "neutre";
}

function dessinerAff() {
  const q = norm($("rechercheAff").value);
  const vus = candidats.filter(function (k) {
    return !q || norm([k.ville, k.etab, k.uai, k.formAcc, k.formOri, k.nom, k.prenom, k.result].join(" ")).indexOf(q) !== -1;
  });

  // Puces de synthèse
  const puces = $("puces");
  puces.innerHTML = "";
  const compte = {};
  vus.forEach(function (k) { const r = k.result || "Sans résultat"; compte[r] = (compte[r] || 0) + 1; });
  const p0 = h("span", "puce"); p0.innerHTML = "<b></b> candidat(s)"; p0.firstChild.textContent = vus.length; puces.appendChild(p0);
  Object.keys(compte).sort().forEach(function (r) {
    const p = h("span", "puce"); p.appendChild(h("b", null, compte[r])); p.appendChild(document.createTextNode(" · " + r)); puces.appendChild(p);
  });

  // Regroupement ville → établissement
  const villes = {};
  vus.forEach(function (k) {
    const v = k.ville || "Ville non renseignée";
    const e = (k.etab || "Établissement non renseigné") + "||" + k.uai;
    villes[v] = villes[v] || {};
    (villes[v][e] = villes[v][e] || []).push(k);
  });

  const liste = $("listeAff");
  liste.innerHTML = "";
  const nomsVilles = Object.keys(villes).sort(function (a, b) { return a.localeCompare(b, "fr"); });
  if (!nomsVilles.length) liste.appendChild(h("div", "vide", "Aucun candidat à afficher pour cette structure."));

  nomsVilles.forEach(function (v) {
    const total = Object.keys(villes[v]).reduce(function (s, e) { return s + villes[v][e].length; }, 0);
    const det = h("details", "ville");
    det.open = true;
    const sum = h("summary");
    sum.appendChild(h("span", null, "📍 " + v));
    sum.appendChild(h("span", "nbville", total + " candidat(s)"));
    det.appendChild(sum);

    Object.keys(villes[v]).sort(function (a, b) { return a.localeCompare(b, "fr"); }).forEach(function (e) {
      const parts = e.split("||");
      const bloc = h("div", "etab");
      const tete = h("div", "etabtete");
      tete.appendChild(h("span", "etabnom", parts[0]));
      if (parts[1]) tete.appendChild(h("span", "uai", "UAI " + parts[1]));
      bloc.appendChild(tete);

      villes[v][e].sort(function (a, b) { return (a.nom + a.prenom).localeCompare(b.nom + b.prenom, "fr"); }).forEach(function (k) {
        const ligne = h("div", "cand");
        ligne.appendChild(h("div", "candnom", (k.nom + " " + k.prenom).trim() || "—"));
        const f = h("div", "formations");
        const a = h("div"); a.appendChild(document.createTextNode("Origine : ")); a.appendChild(h("span", "fl", k.formOri || "—")); f.appendChild(a);
        const b = h("div"); b.appendChild(document.createTextNode("Accueil : ")); b.appendChild(h("span", "fl", k.formAcc || "—")); f.appendChild(b);
        ligne.appendChild(f);
        ligne.appendChild(h("span", "badge " + classeResultat(k.result), k.result || "Sans résultat"));
        bloc.appendChild(ligne);
      });
      det.appendChild(bloc);
    });
    det.appendChild(h("div", null)).style.height = "8px";
    liste.appendChild(det);
  });
  $("compteurAff").textContent = vus.length + " / " + candidats.length;
}

// Teintes des sous-menus : dégradé de la couleur de l'entrée parente (e1 vert, e2 saumon, e3 bleu, e4 rose).
function appliquerTeinte(el, classeParent, i, n) {
  const k = classeParent.replace("e", "");
  const p = n > 1 ? Math.round(5 + (i / (n - 1)) * 65) : 30;   // du plus clair au plus soutenu
  el.style.background = "color-mix(in srgb, var(--c" + k + ") " + (100 - p) + "%, var(--c" + k + "b) " + p + "%)";
  el.style.borderColor = "var(--c" + k + "b)";
}

let sousJeton = 0;

function ouvrirSousMenu(entree, c) {
  vueOuverte = true;
  const jetonS = ++sousJeton;
  montrer("vueSous");
  $("titreSous").textContent = entree.label + " — " + c.label;
  const bloc = $("choixSous");
  bloc.innerHTML = "";
  entree.sousmenu.forEach(function (ch, i) {
    const actif = !!(ch.tableId && ch.vue);
    const el = h("button", "entree " + entree.classe + (actif ? "" : " inactif"), ch.label);
    el.type = "button";
    appliquerTeinte(el, entree.classe, i, entree.sousmenu.length);
    el.appendChild(h("small", null, ch.tableId ? "Table : " + ch.tableId : "Table à préciser"));
    if (actif) {
      el.addEventListener("click", function () {
        retourCtrlFn = function () { ouvrirSousMenu(entree, c); };
        ouvrirControles(entree, ch, c);
      });
      // Compteurs : élèves et établissements d'origine concernés pour cette structure
      const nbs = h("div", "nbs");
      nbs.appendChild(h("span", "att", "Calcul en cours…"));
      el.appendChild(nbs);
      lireLignesCtrl(ch, c, null).then(function (r) {
        if (jetonS !== sousJeton) return;
        nbs.innerHTML = "";
        if (!r.serviceTrouve) { nbs.appendChild(h("span", "att", "Colonne « Service » introuvable")); return; }
        if (!r.lignes.length) { nbs.appendChild(h("span", "att", "Non concerné")); el.classList.add("nc"); return; }
        nbs.appendChild(h("span", null, "👩‍🎓 " + pluriel(compterDistincts(r.lignes, "eleve"), "élève")));
        const cf = VUES_CTRL[ch.vue], lib = cf.libEtab || ["établissement", "établissements"];
        nbs.appendChild(h("span", null, "🏫 " + pluriel(compterDistincts(r.lignes, cf.cleEtab || "etabOri"), lib[0], lib[1])));
      }).catch(function () {
        if (jetonS !== sousJeton) return;
        nbs.innerHTML = "";
        nbs.appendChild(h("span", "att", "Table illisible"));
      });
    }
    bloc.appendChild(el);
  });
}

// Lit une table et détecte ses colonnes ; renvoie data, cols et la fonction valeur(cle, i).
// Les lectures (table, métadonnées, tables référencées) sont mises en cache et faites en parallèle.
async function chargerColonnes(tableId, champs) {
  const res = await Promise.all([lireTable(tableId), lireMeta(tableId).catch(function () { return null; })]);
  const data = res[0];
  const metas = res[1] || Object.keys(data)
    .filter(function (k) { return k !== "id" && k !== "manualSort" && k.indexOf("gristHelper_") !== 0; })
    .map(function (k) { return { colId: k, label: k, type: "", visible: null }; });
  const cols = {};
  champs.forEach(function (ch) { cols[ch.cle] = trouverColonne(ch, metas); });
  const resolu = {};
  await Promise.all(champs.map(async function (ch) {
    const m = cols[ch.cle];
    if (!m || m.type.indexOf("Ref:") !== 0) return;
    try {
      const ref = await lireTable(m.type.slice(4));
      const cible = m.visible && ref[m.visible] ? m.visible : null;
      const dict = {};
      ref.id.forEach(function (id, i) { dict[id] = cible ? ref[cible][i] : id; });
      resolu[ch.cle] = dict;
    } catch (e) { /* on garde la valeur brute */ }
  }));
  const valeur = function (cle, i) {
    const m = cols[cle];
    if (!m || !data[m.colId]) return "";
    const v = data[m.colId][i];
    return texte(resolu[cle] && resolu[cle][v] !== undefined ? resolu[cle][v] : v);
  };
  return { data: data, cols: cols, valeur: valeur };
}

// Toutes les lignes d'une table (tous services), construites une seule fois puis mises en cache.
function lignesTable(choix) {
  return memo("l:" + choix.tableId, async function () {
    const cfg = VUES_CTRL[choix.vue];
    const r = await chargerColonnes(choix.tableId, cfg.champs);
    const lignes = [];
    if (r.cols.service) {
      (r.data.id || []).forEach(function (_, i) {
        const l = {};
        cfg.champs.forEach(function (ch) { l[ch.cle] = r.valeur(ch.cle, i); });
        l._svc = sansEspaces(l.service);
        lignes.push(l);
      });
    }
    return { cols: r.cols, champs: cfg.champs, lignes: lignes, serviceTrouve: !!r.cols.service };
  });
}

// Garde uniquement les lignes du service en charge correspondant à la structure. Renvoie { lignes, serviceTrouve }.
async function lireLignesCtrl(choix, c, ulDiag) {
  const t = await lignesTable(choix);
  if (ulDiag) t.champs.forEach(function (ch) {
    ulDiag.appendChild(h("li", null, ch.nom + " ← " + (t.cols[ch.cle] ? t.cols[ch.cle].label : "NON TROUVÉE")));
  });
  if (!t.serviceTrouve) return { lignes: [], serviceTrouve: false };
  const attendues = c.valeurs.map(sansEspaces);
  return { lignes: t.lignes.filter(function (l) { return attendues.indexOf(l._svc) !== -1; }), serviceTrouve: true };
}

function compterDistincts(lignes, cle) {
  return new Set(lignes.map(function (l) { return l[cle]; }).filter(function (v) { return v; })).size;
}
function pluriel(n, mot, plur) { return n + " " + (n > 1 ? (plur || mot + "s") : mot); }

// Préchargement en arrière-plan des tables des sous-menus (les clics suivants sont alors quasi instantanés).
function precharger() {
  ENTREES.forEach(function (e) {
    (e.sousmenu || []).forEach(function (ch) {
      if (ch.tableId && ch.vue) lignesTable(ch).catch(function () {});
    });
  });
}

async function ouvrirControles(entree, choix, c) {
  vueOuverte = true;
  ctrlCfg = VUES_CTRL[choix.vue];
  const jeton = ++ctrlJeton;
  montrer("vueCtrl");
  dessinerOnglets(entree, choix, c);
  $("titreCtrl").textContent = choix.label + " — " + c.label;
  $("rechercheCtrl").value = "";
  $("compteurCtrl").textContent = "Chargement…";
  $("listeCtrl").innerHTML = "";
  $("chipsChg").innerHTML = "";
  $("alerteCtrl").innerHTML = "";
  $("diagCtrl").innerHTML = "";
  $("filtreLib").textContent = (ctrlCfg.filtreLib || "") + " :";
  ctrlFiltres = new Set();
  ctrlLignes = [];

  try {
    const r = await lireLignesCtrl(choix, c, $("diagCtrl"));
    if (jeton !== ctrlJeton) return;
    if (!r.serviceTrouve) {
      $("alerteCtrl").appendChild(h("div", "alerte", "La colonne « Service en charge du traitement » est introuvable : aucune ligne n'est affichée afin de ne pas montrer des données d'une autre structure. Indiquez son libellé exact dans CHAMPS_CTRL / CHAMPS_2PRO / CHAMPS_2PRO_SANS_AVIS (champ « col »)."));
    } else {
      ctrlLignes = r.lignes;
    }
    // Une teinte pastel par valeur du filtre (même ordre partout)
    ctrlTeintes = {};
    if (ctrlCfg.filtre) {
      Array.from(new Set(ctrlLignes.map(function (l) { return l[ctrlCfg.filtre] || ""; }))).sort(function (a, b) { return a.localeCompare(b, "fr"); })
        .forEach(function (v, i) { ctrlTeintes[v] = "t" + (i % 6); });
    }
    dessinerCtrl();
  } catch (err) {
    console.error(err);
    if (jeton !== ctrlJeton) return;
    $("compteurCtrl").textContent = "Impossible de lire la table « " + choix.tableId + " » (identifiant correct ? même document ?).";
  }
}

function libChg(v) { return v || "Non renseigné"; }

function remplirCellule(td, col, l) {
  const v = l[col.cle];
  if (!v) { td.textContent = "—"; return; }
  if (col.rendu === "rang") td.appendChild(h("span", "rang", v));
  else if (col.rendu === "code") td.appendChild(h("span", "code", v));
  else if (col.rendu === "bonus") td.appendChild(h("span", "bonus", v));
  else if (col.rendu === "chg") td.appendChild(h("span", "chg " + (ctrlTeintes[v] || "t-tous"), libChg(v)));
  else td.textContent = v;
}

// Tableau des lignes d'un groupe. Les colonnes « groupe » sont fusionnées (rowspan) sur les lignes consécutives
// ayant les mêmes valeurs (groupeSur de la colonne, sinon grouperPar de la vue).
function construireTable(lignes, cfg) {
  const nb = lignes.length;
  const defil = h("div", "ctab-defil");
  const t = h("table", "ctab");
  const hr = t.createTHead().insertRow();
  cfg.colonnes.forEach(function (col) { hr.appendChild(h("th", null, col.titre)); });
  const tb = t.createTBody();

  const spans = {};
  cfg.colonnes.forEach(function (col, ci) {
    if (!col.groupe) return;
    const cles = col.groupeSur || cfg.grouperPar;
    const arr = new Array(nb).fill(0);
    let i = 0;
    while (i < nb) {
      let j = i + 1;
      while (j < nb && cles.every(function (k) { return lignes[j][k] === lignes[i][k]; })) j++;
      arr[i] = j - i;
      i = j;
    }
    spans[ci] = arr;
  });

  lignes.forEach(function (l, k) {
    const tr = tb.insertRow();
    const debut = k === 0 || !cfg.grouperPar.every(function (c) { return lignes[k][c] === lignes[k - 1][c]; });
    if (debut) tr.className = "debut";
    cfg.colonnes.forEach(function (col, ci) {
      if (col.groupe && !spans[ci][k]) return;
      const td = tr.insertCell();
      if (col.groupe) td.rowSpan = spans[ci][k];
      if (col.cle === "eleve") td.className = "eleve";
      remplirCellule(td, col, l);
    });
  });
  defil.appendChild(t);
  return defil;
}

function dessinerCtrl() {
  const cfg = ctrlCfg;
  const cleF = cfg.filtre;
  const q = norm($("rechercheCtrl").value);

  // Filtre (puces cliquables, sélection multiple ; aucune sélection = tout)
  $("filtreBloc").classList.toggle("cache", !cleF);
  const chips = $("chipsChg");
  chips.innerHTML = "";
  if (cleF) {
    const nbPar = {};
    ctrlLignes.forEach(function (l) { const v = l[cleF] || ""; nbPar[v] = (nbPar[v] || 0) + 1; });
    const tous = h("button", "chip t-tous" + (ctrlFiltres.size === 0 ? " on" : ""), "Tous");
    tous.type = "button";
    tous.appendChild(h("b", null, ctrlLignes.length));
    tous.addEventListener("click", function () { ctrlFiltres.clear(); dessinerCtrl(); });
    chips.appendChild(tous);
    Object.keys(nbPar).sort(function (a, b) { return a.localeCompare(b, "fr"); }).forEach(function (v) {
      const b = h("button", "chip " + ctrlTeintes[v] + (ctrlFiltres.has(v) ? " on" : ""), libChg(v));
      b.type = "button";
      b.appendChild(h("b", null, nbPar[v]));
      b.addEventListener("click", function () {
        if (ctrlFiltres.has(v)) ctrlFiltres.delete(v); else ctrlFiltres.add(v);
        dessinerCtrl();
      });
      chips.appendChild(b);
    });
  }

  const vus = ctrlLignes.filter(function (l) {
    if (cleF && ctrlFiltres.size && !ctrlFiltres.has(l[cleF] || "")) return false;
    return !q || norm([l[cfg.grouper || "etabOri"]].concat(cfg.colonnes.map(function (col) { return l[col.cle]; })).join(" ")).indexOf(q) !== -1;
  });

  // Regroupement (par établissement d'origine ou d'accueil selon la vue)
  const cleG = cfg.grouper || "etabOri";
  const groupes = {};
  vus.forEach(function (l) {
    const e = l[cleG] || cfg.groupeVide || "Établissement d'origine non renseigné";
    (groupes[e] = groupes[e] || []).push(l);
  });

  const liste = $("listeCtrl");
  liste.innerHTML = "";
  const noms = Object.keys(groupes).sort(function (a, b) { return a.localeCompare(b, "fr"); });
  if (!noms.length) liste.appendChild(h("div", "vide", "Aucune ligne à afficher pour cette structure."));

  const cleTri = cfg.tri || ["eleve"];
  noms.forEach(function (nom) {
    const lignesE = groupes[nom].slice().sort(function (a, b) {
      for (let k = 0; k < cleTri.length; k++) {
        const d = (a[cleTri[k]] || "").localeCompare(b[cleTri[k]] || "", "fr");
        if (d) return d;
      }
      return cfg.triNum ? (parseFloat(a[cfg.triNum]) || 0) - (parseFloat(b[cfg.triNum]) || 0) : 0;
    });
    const premier = function (cle) { const f = lignesE.find(function (l) { return l[cle]; }); return f ? f[cle] : ""; };

    const det = h("details", "etabo");
    det.open = true;
    const sum = h("summary");
    sum.appendChild(h("span", "eonom", "🏫 " + nom));
    if (cfg.contact !== false) {
      const contact = h("span", "eocontact");
      const tel = premier("tel"), mel = premier("mel");
      if (tel) { const a = h("a", null, "📞 " + tel); a.href = "tel:" + tel.replace(/\s+/g, ""); a.addEventListener("click", function (ev) { ev.stopPropagation(); }); contact.appendChild(a); }
      else contact.appendChild(h("span", "absent", "📞 non renseigné"));
      if (mel) { const a = h("a", null, "✉ " + mel); a.href = "mailto:" + mel; a.addEventListener("click", function (ev) { ev.stopPropagation(); }); contact.appendChild(a); }
      else contact.appendChild(h("span", "absent", "✉ non renseigné"));
      sum.appendChild(contact);
    }
    sum.appendChild(h("span", "eonb", compterDistincts(lignesE, "eleve") + " élève(s) · " + lignesE.length + " " + cfg.unite));
    det.appendChild(sum);

    if (cfg.sousGroupe) {
      // Un tableau par formation d'accueil (libellé + code)
      const sg = cfg.sousGroupe, parSg = {}, ordre = [];
      lignesE.forEach(function (l) {
        const k = (l[sg.titre] || "") + "\u0001" + (l[sg.code] || "");
        if (!parSg[k]) { parSg[k] = []; ordre.push(k); }
        parSg[k].push(l);
      });
      ordre.sort(function (a, b) {
        return (parSg[a][0][sg.titre] || "").localeCompare(parSg[b][0][sg.titre] || "", "fr") ||
          (parSg[a][0][sg.code] || "").localeCompare(parSg[b][0][sg.code] || "", "fr");
      });
      ordre.forEach(function (k) {
        const sub = parSg[k], f = sub[0];
        const ent = h("div", "sg");
        ent.appendChild(h("span", null, "🎓 " + (f[sg.titre] || "Formation non renseignée")));
        if (f[sg.code]) ent.appendChild(h("span", "code", f[sg.code]));
        ent.appendChild(h("span", "eonb", compterDistincts(sub, "eleve") + " élève(s)"));
        det.appendChild(ent);
        det.appendChild(construireTable(sub, cfg));
      });
    } else {
      det.appendChild(construireTable(lignesE, cfg));
    }
    liste.appendChild(det);
  });
  $("compteurCtrl").textContent = vus.length + " / " + ctrlLignes.length + " ligne(s)";
}
$("rechercheCtrl").addEventListener("input", dessinerCtrl);
</script>
